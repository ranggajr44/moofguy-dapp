<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOOFGUY - ALL IN ONE DAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #1e40af 0%, #09090b 100%); min-height: 100vh; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .active-tab { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-item { transition: all 0.3s; cursor: pointer; }
        .nav-item:hover { color: #60a5fa; }
    </style>
</head>
<body class="pb-28">

    <header class="p-6 flex justify-between items-center sticky top-0 z-50 glass mb-4">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter text-blue-400">MOOFGUY</h1>
            <p class="text-[8px] font-bold text-zinc-500 uppercase tracking-widest">Base Mainnet Active</p>
        </div>
        <button id="connectBtn" onclick="connect()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-2xl text-[10px] font-black shadow-lg transition-all active:scale-95">
            CONNECT WALLET
        </button>
    </header>

    <main class="max-w-md mx-auto px-6">
        
        <div id="tab-home" class="tab-content active-tab">
            <div class="glass rounded-[45px] p-10 text-center shadow-2xl mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent"></div>
                <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em] mb-4">Current ETH Balance</p>
                <h2 id="displayBal" class="text-7xl font-black mb-10 tracking-tighter text-zinc-800 transition-colors duration-500">0.0000</h2>
                
                <button id="claimBtn" disabled onclick="handleClaim()" class="w-full bg-zinc-800 py-5 rounded-[25px] font-black text-sm tracking-widest transition-all shadow-xl active:scale-95">
                    <span id="btnText">CONNECT FIRST</span>
                </button>
            </div>
            
            <div class="glass rounded-3xl p-5 border-blue-500/20 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 bg-green-500 rounded-full animate-ping"></div>
                    <p class="text-[10px] font-black italic uppercase">System Online</p>
                </div>
                <p class="text-[10px] text-zinc-400 font-bold">REWARD: 5,000 MOOF/Day</p>
            </div>
        </div>

        <div id="tab-trade" class="tab-content">
            <div class="glass rounded-[35px] p-8 mb-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black italic text-lg text-blue-300">TRADING SIM</h3>
                    <span class="text-[10px] bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full font-bold">FREE MODE</span>
                </div>
                <div class="bg-black/50 p-6 rounded-3xl border border-zinc-800 text-center mb-8">
                    <p class="text-[10px] text-zinc-500 font-bold mb-1">BTC / USDT</p>
                    <p id="btcPrice" class="text-3xl font-black text-green-400">$67,432.10</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="alert('LONG Position Opened!')" class="bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-black text-xs shadow-lg transition-all active:scale-95">BUY / LONG</button>
                    <button onclick="alert('SHORT Position Opened!')" class="bg-red-600 hover:bg-red-500 py-4 rounded-2xl font-black text-xs shadow-lg transition-all active:scale-95">SELL / SHORT</button>
                </div>
            </div>
        </div>

        <div id="tab-friends" class="tab-content">
            <div class="glass rounded-[35px] p-8 text-center">
                <div class="w-16 h-16 bg-blue-600/20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="text-3xl">👥</span>
                </div>
                <h3 class="font-black text-xl mb-2 italic">UNDANG TEMAN</h3>
                <p class="text-xs text-zinc-400 mb-8 leading-relaxed">Dapatkan bonus 10% setiap kali temanmu melakukan claim token MOOF.</p>
                
                <div class="bg-zinc-900/80 p-5 rounded-2xl border border-dashed border-zinc-700 mb-6 group">
                    <p class="text-[9px] text-zinc-500 uppercase font-black mb-2 tracking-widest text-left">Your Referral Link</p>
                    <p id="refLink" class="text-[11px] text-blue-400 font-bold break-all">https://moofguy.netlify.app/ref?id=USER_ID</p>
                </div>
                
                <button onclick="copyRef()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-black text-xs transition-all shadow-lg active:scale-95">
                    SALIN LINK REFERRAL
                </button>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-8 left-6 right-6 glass rounded-[30px] p-3 flex justify-around items-center shadow-2xl z-50 border-t border-white/10">
        <button onclick="switchTab('home')" class="nav-item flex flex-col items-center gap-1 flex-1">
            <span class="text-xl">🏠</span>
            <span class="text-[8px] font-black uppercase">Home</span>
        </button>
        <button onclick="switchTab('trade')" class="nav-item flex flex-col items-center gap-1 flex-1 border-x border-zinc-800">
            <span class="text-xl">📈</span>
            <span class="text-[8px] font-black uppercase">Trade</span>
        </button>
        <button onclick="switchTab('friends')" class="nav-item flex flex-col items-center gap-1 flex-1">
            <span class="text-xl">🎁</span>
            <span class="text-[8px] font-black uppercase">Invite</span>
        </button>
    </nav>

    <script>
        let walletConnected = false;

        async function connect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // 1. Memicu Popup OKX/MetaMask ASLI
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];

                    // 2. Ambil Saldo Blockchain ASLI
                    const balanceHex = await window.ethereum.request({ 
                        method: 'eth_getBalance', 
                        params: [userAddress, 'latest'] 
                    });
                    const realEth = parseInt(balanceHex, 16) / 10**18;

                    walletConnected = true;

                    // 3. Update UI
                    document.getElementById('connectBtn').innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                    const balDisplay = document.getElementById('displayBal');
                    balDisplay.innerText = realEth.toFixed(4);
                    balDisplay.classList.replace('text-zinc-800', 'text-white');

                    // 4. Aktifkan Fitur Claim
                    const claimBtn = document.getElementById('claimBtn');
                    claimBtn.disabled = false;
                    claimBtn.classList.replace('bg-zinc-800', 'bg-blue-600');
                    document.getElementById('btnText').innerText = "CLAIM MOOF TOKEN";

                    alert("Koneksi Berhasil! Saldo Asli Terdeteksi.");
                } catch (err) {
                    alert("Koneksi dibatalkan user.");
                }
            } else {
                alert("Gunakan Mises Browser & Install OKX Wallet!");
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active-tab'));
            document.getElementById('tab-' + tabId).classList.add('active-tab');
        }

        function handleClaim() {
            if(walletConnected) {
                alert("Transaksi Berhasil! Token MOOF akan masuk ke wallet lo dalam 24 jam.");
            }
        }

        function copyRef() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link);
            alert("Link Referral disalin, Bos!");
        }

        // Simulasi Pergerakan Harga BTC
        setInterval(() => {
            const priceEl = document.getElementById('btcPrice');
            const currentPrice = 67432 + (Math.random() * 10);
            priceEl.innerText = "$" + currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2});
        }, 3000);
    </script>
</body>
</html>
